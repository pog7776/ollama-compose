# Generic Raspberry Pi base. Extends master-ollama.yml with CPU-only ARM settings
# suitable for any Raspberry Pi model.
#
# NOTE: The official `ollama/ollama:latest` image provides multi-arch
# linux/arm64 binaries. Raspberry Pi hardware must run a 64-bit OS (aarch64).
services:
  ollama-rpi-base:
    extends:
      file: ../master-ollama.yml
      service: ollama-base
    environment:
      # Single concurrent generation: avoid splitting small core counts across requests
      - OLLAMA_NUM_PARALLEL=1
      # Flash attention is CUDA/Metal only; disable to prevent ARM CPU fallback penalties
      - OLLAMA_FLASH_ATTENTION=0
