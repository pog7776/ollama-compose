# Raspberry Pi 3 base (BCM2837 / BCM2837B0, 4x Cortex-A53 @ 1.2-1.4GHz).
#
# IMPORTANT:
# - Must run a 64-bit OS (aarch64) as Ollama only publishes 64-bit ARM images.
# - Pi 3 Cortex-A53 lacks ARMv8.2 dotproduct instructions and has limited
#   memory bandwidth (single-channel LPDDR2 ~900MHz).
# - Expect generation speeds of ~1-3 tokens/second on 0.5B-1B models.
services:
  ollama-pi3-base:
    extends:
      file: ../ollama-base.yml
      service: ollama-rpi-base
    environment:
      # Pin to all 4 physical Cortex-A53 cores
      - OLLAMA_NUM_THREADS=4
