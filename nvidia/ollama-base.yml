# NVIDIA GPU base. Extends the generic base with NVIDIA device passthrough,
# driver capabilities, and flash attention. Extended further by
# environment-specific compose files (e.g. wsl/compose.yml, linux/compose.yml).
#
# PREREQUISITE: the host needs the NVIDIA Container Toolkit installed and
# configured (this is what lets Docker's `deploy.resources.reservations`
# GPU syntax below actually reach the GPU - without it, the container will
# fail to start or silently fall back to CPU). On WSL2, this means the
# toolkit installed inside the WSL distro itself, using the Windows NVIDIA
# driver already installed on the host (do NOT install a separate Linux
# NVIDIA driver inside WSL2). See:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# Verify with: docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu24.04 nvidia-smi
services:
  ollama-nvidia:
    extends:
      file: ../master-ollama.yml
      service: ollama-base
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
