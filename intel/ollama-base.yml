# Generic Intel CPU base. Extends master-ollama.yml with x86_64 settings
# suitable for any Intel system (Core, Xeon, Celeron/Pentium).
#
# NOTE: The official `ollama/ollama:latest` image provides multi-arch
# linux/amd64 binaries with built-in AVX/AVX2/AVX-512 CPU runners.
services:
  ollama-intel:
    extends:
      file: ../master-ollama.yml
      service: ollama-base
    environment:
      # Flash attention is CUDA/Metal only; disable to prevent CPU fallback penalties
      - OLLAMA_FLASH_ATTENTION=0
